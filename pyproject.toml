[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "harrislab"
version = "0.2.0"
description = "Provenance-aware computational reasoning for Harris matrices"
requires-python = ">=3.11"

[project.optional-dependencies]
acquisition = ["PyMuPDF>=1.24"]

[tool.setuptools.packages.find]
include = ["harrislab*"]
