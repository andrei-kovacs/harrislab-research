name: Publish v0.1.0 release

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v0.1.0.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0
        run: |
          set -euo pipefail
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi
          notes_file="$RUNNER_TEMP/release-notes.md"
          git show "${RELEASE_TAG}:docs/RELEASE_NOTES_0.1.0.md" > "$notes_file"
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "HarrisLab 0.1.0 research seed" \
            --notes-file "$notes_file"
